<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Version Management System</title>
    <meta name="description" content="Manage application and codebase version history with file creation, upload, editing, deletion tracking, and customizable themes." />
    <meta property="og:title" content="Version Management System" />
    <meta property="og:description" content="Manage application and codebase version history with file creation, upload, editing, deletion tracking, and customizable themes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('vms_settings_v1');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
